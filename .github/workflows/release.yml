name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Build release tarball
        run: |
          tag="${GITHUB_REF_NAME}"
          tar --exclude='.git' --exclude='node_modules' \
              -czf "run-agency-action-${tag}.tar.gz" .

      - name: Generate Sigstore attestation
        uses: actions/attest-build-provenance@92c65d2898f1f53cfdc910b962cecff86e7f8fcc  # v1
        with:
          subject-path: run-agency-action-*.tar.gz

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            --title "$tag" \
            --notes-file CHANGELOG.md \
            run-agency-action-*.tar.gz
