name: Run Agency agent
description: Compile and execute an Agency (.agency) file
inputs:
  file:
    description: Path to the .agency file to run
    required: true
  node-version:
    description: Node version
    required: false
    default: '20'
  extra-deps:
    description: Space-separated npm packages to install (added to bundled stdlib)
    required: false
    default: ''
runs:
  using: composite
  steps:
    # `realpath` collapses the trailing `/.` that `uses: ./` leaves behind.
    - id: paths
      shell: bash
      run: |
        action_path="$(realpath "$GITHUB_ACTION_PATH")"
        echo "action_path=$action_path" >> "$GITHUB_OUTPUT"
    # Deliberately no npm caching — it measured at ~0.3s and cost four bugs.
    # See DEVELOPMENT.md, "Why there is no npm cache".
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
    - shell: bash
      env:
        AGENCY_FILE: ${{ inputs.file }}
        AGENCY_EXTRA_DEPS: ${{ inputs.extra-deps }}
      run: ${{ steps.paths.outputs.action_path }}/scripts/run.sh
