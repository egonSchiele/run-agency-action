name: Run Agency agent
description: Compile and execute an Agency (.agency) file
inputs:
  file:
    description: Path to the .agency file to run
    required: true
  node-version:
    description: Node version
    required: false
    default: '20'
  extra-deps:
    description: Space-separated npm packages to install (added to bundled stdlib)
    required: false
    default: ''
runs:
  using: composite
  steps:
    # `realpath` collapses the trailing `/.` that `uses: ./` leaves behind.
    # The lockfile is hashed here, in bash, because it lives in the action's
    # directory — outside $GITHUB_WORKSPACE, where `hashFiles()` and
    # setup-node's `cache-dependency-path` silently find nothing.
    # See DEVELOPMENT.md, "How to update to a newer agency-lang version".
    - id: paths
      shell: bash
      run: |
        action_path="$(realpath "$GITHUB_ACTION_PATH")"
        echo "action_path=$action_path" >> "$GITHUB_OUTPUT"
        lockfile="$action_path/bundled/package-lock.json"
        # sha256sum on Linux runners, shasum on macOS. Both print "<hash>  <path>".
        if command -v sha256sum >/dev/null 2>&1; then
          lockhash="$(sha256sum "$lockfile" | cut -d' ' -f1)"
        else
          lockhash="$(shasum -a 256 "$lockfile" | cut -d' ' -f1)"
        fi
        echo "lockhash=$lockhash" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
    # npm's default cache dir, hardcoded rather than read from `npm config get
    # cache` — that value is consumer-controlled via .npmrc, and it decides
    # which directory gets uploaded into a cache other runs can read.
    # No `restore-keys`: a cache built from a different lockfile is not a
    # cache for this one.
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      with:
        path: ~/.npm
        key: agency-run-action-npm-${{ runner.os }}-${{ runner.arch }}-node${{ inputs.node-version }}-${{ steps.paths.outputs.lockhash }}
    - shell: bash
      env:
        AGENCY_FILE: ${{ inputs.file }}
        AGENCY_EXTRA_DEPS: ${{ inputs.extra-deps }}
      run: ${{ steps.paths.outputs.action_path }}/scripts/run.sh
